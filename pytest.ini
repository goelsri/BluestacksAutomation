# pytest.ini

[pytest]
minversion = 6.0
addopts = --html=reports/report.html --self-contained-html --maxfail=2 --tb=short
testpaths =
    tests

markers =
    smoke: quick health-check scenarios
    regression: full suite for older and new features
    functional: business-critical flow validation

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

filterwarnings =
    ignore::DeprecationWarning
